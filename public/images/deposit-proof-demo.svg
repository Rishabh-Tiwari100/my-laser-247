<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 390 700" preserveAspectRatio="none" role="img" aria-labelledby="title description">
  <title id="title">Sample payment proof</title>
  <desc id="description">A sample successful mobile payment receipt for development previews.</desc>
  <rect width="390" height="700" fill="#eef8ff"/>
  <rect width="390" height="54" fill="#ffffff"/>
  <text x="22" y="34" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12263a">Payment receipt</text>
  <circle cx="195" cy="132" r="38" fill="#16a34a"/>
  <path d="M176 132l12 12 25-28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#425466">Payment successful</text>
  <text x="195" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#12263a">₹500</text>
  <rect x="24" y="290" width="342" height="226" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="331" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Paid to</text>
