  <line x1="48" y1="353" x2="342" y2="353" stroke="#e2e8f0"/>
  <text x="48" y="390" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Payment method</text>
  <text x="342" y="390" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">UPI</text>
  <line x1="48" y1="412" x2="342" y2="412" stroke="#e2e8f0"/>
  <text x="48" y="449" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Transaction ID</text>
  <text x="342" y="449" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12263a">610715564360</text>
  <line x1="48" y1="471" x2="342" y2="471" stroke="#e2e8f0"/>
  <text x="48" y="497" font-family="Arial, sans-serif" font-size="14" fill="#64748b">21 Jul 2026, 05:01</text>
  <rect x="24" y="550" width="342" height="54" rx="9" fill="#0ea5e9"/>
  <text x="195" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">UPI PAYMENT</text>
  <text x="195" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Development preview only</text>
